<svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Robot Head -->
  <rect x="10" y="14" width="28" height="22" rx="4" fill="#EF4444"/>
  <!-- Eyes -->
  <rect x="15" y="20" width="7" height="7" rx="2" fill="white"/>
  <rect x="26" y="20" width="7" height="7" rx="2" fill="white"/>
  <!-- Pupils -->
  <circle cx="18.5" cy="23.5" r="2" fill="#1a1a1a"/>
  <circle cx="29.5" cy="23.5" r="2" fill="#1a1a1a"/>
  <!-- Antennae -->
  <rect x="14" y="4" width="5" height="11" rx="2.5" fill="#DC2626"/>
  <rect x="29" y="4" width="5" height="11" rx="2.5" fill="#DC2626"/>
  <!-- Antenna tips -->
  <circle cx="16.5" cy="3" r="3" fill="#EF4444"/>
  <circle cx="31.5" cy="3" r="3" fill="#EF4444"/>
  <!-- Mouth -->
  <rect x="17" y="30" width="14" height="4" rx="1" fill="#B91C1C"/>
  <!-- Ears -->
  <rect x="5" y="20" width="4" height="10" rx="2" fill="#DC2626"/>
  <rect x="39" y="20" width="4" height="10" rx="2" fill="#DC2626"/>
</svg>
