<svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Circle -->
  <circle cx="64" cy="64" r="60" fill="#1a1a1a"/>
  
  <!-- Robot Head -->
  <rect x="28" y="38" width="72" height="56" rx="8" fill="#EF4444"/>
  
  <!-- Eyes -->
  <rect x="40" y="52" width="18" height="18" rx="4" fill="white"/>
  <rect x="70" y="52" width="18" height="18" rx="4" fill="white"/>
  
  <!-- Pupils -->
  <circle cx="49" cy="61" r="5" fill="#1a1a1a"/>
  <circle cx="79" cy="61" r="5" fill="#1a1a1a"/>
  
  <!-- Eye shine -->
  <circle cx="46" cy="58" r="2" fill="white"/>
  <circle cx="76" cy="58" r="2" fill="white"/>
  
  <!-- Antennae -->
  <rect x="38" y="10" width="12" height="30" rx="6" fill="#DC2626"/>
  <rect x="78" y="10" width="12" height="30" rx="6" fill="#DC2626"/>
  
  <!-- Antenna tips (glowing) -->
  <circle cx="44" cy="8" r="7" fill="#EF4444"/>
  <circle cx="84" cy="8" r="7" fill="#EF4444"/>
  <circle cx="44" cy="8" r="4" fill="#FCA5A5"/>
  <circle cx="84" cy="8" r="4" fill="#FCA5A5"/>
  
  <!-- Mouth -->
  <rect x="46" y="80" width="36" height="8" rx="3" fill="#B91C1C"/>
  
  <!-- Ears/Speakers -->
  <rect x="14" y="52" width="10" height="24" rx="5" fill="#DC2626"/>
  <rect x="104" y="52" width="10" height="24" rx="5" fill="#DC2626"/>
  
  <!-- Chest light -->
  <circle cx="64" cy="105" r="8" fill="#FCA5A5"/>
  <circle cx="64" cy="105" r="5" fill="white"/>
  
  <!-- Text "ELF" -->
  <text x="64" y="122" text-anchor="middle" fill="#EF4444" font-family="Arial, sans-serif" font-size="10" font-weight="bold">ELF</text>
</svg>
